name: Build firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"

jobs:
  build:
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - uses: actions/checkout@v4

      # actions/setup-python failed trying to fetch a build for this runner's
      # OS ("Version 3.12 ... was not found for Debian 13"), and this
      # runner's system python3/pip is PEP 668 "externally managed" without
      # even supporting --break-system-packages (older pip build). A venv
      # sidesteps both: portable regardless of pip version or OS packaging.
      - name: Install PlatformIO
        run: |
          python3 -m venv .pio-venv
          .pio-venv/bin/pip install platformio

      - name: Add PlatformIO to PATH
        run: echo "$PWD/.pio-venv/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: firmware
        run: pio run
