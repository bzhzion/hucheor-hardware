name: Build firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"

jobs:
  build:
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        working-directory: firmware
        run: pio run
