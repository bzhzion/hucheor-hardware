; PlatformIO project for the Hucheor beacon firmware (ESP32).
; See README.md in this folder for wiring and current status.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    https://github.com/wladimir-computin/CC1101-ESP-Arduino.git
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.3.0
